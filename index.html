<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>சோசியல் மீடியா - உள்நுழைவு</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 300px;
            text-align: center;
            border-radius: 4px;
        }
        h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 36px;
            margin-bottom: 30px;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>என் ஆப்</h1>
        <form>
            <input type="text" placeholder="தொலைபேசி எண், பயனர்பெயர் அல்லது மின்னஞ்சல்" required>
            <input type="password" placeholder="கடவுச்சொல்" required>
            <button type="submit">உள்நுழைக (Log In)</button>
        </form>
    </div>

</body>
</html>
